# Database connection details
# Actualizado al puerto 15029 (MySQL Clásico) según el Service URI de Aiven
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://mysql-291cc8ba-uqvirtual-cb32.d.aivencloud.com:15029/defaultdb?sslMode=DISABLE&allowPublicKeyRetrieval=true}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot common properties
server.port=8080
spring.application.name=solicitudes-academicas

# AI Configuration (SOLID Strategy)
# Opciones disponibles: gemini, simulado
pisc.ia.provider=gemini

# Google AI Gemini Configuration
# Obtener API Key de: https://aistudio.google.com/app/apikey
# Es recomendable configurarla como variable de entorno: GOOGLE_AI_GEMINI_API_KEY
google.ai.gemini.api-key=${GOOGLE_AI_GEMINI_API_KEY}
